[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "frameflow-ai"
version = "1.0.0"
description = "Intelligent Dead Frame Remover for Video Editors"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "FrameFlow AI Team"},
]
keywords = ["video", "animation", "frame", "duplicate", "detection", "AI"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Video",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "PySide6>=6.6.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "scikit-image>=0.22.0",
    "imagehash>=4.3.0",
    "onnxruntime>=1.17.0",
    "ffmpeg-python>=0.2.0",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.17.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.3.0",
    "PyInstaller>=6.0.0",
]

[project.gui-scripts]
frameflow = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
